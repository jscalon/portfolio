<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" role="img" aria-label="jscalon">
  <!--
    Geometry, not text. The icon this replaced set "JG" with <text> and a system-ui
    font stack, so the glyphs were whatever the rasterising OS happened to have, and
    it leaned on dominant-baseline for centring, which is unevenly supported.

    The staircase is the name, not decoration: Juan Escalona, `js`, and *escala* for
    software that has to scale — the three readings folded into "jscalon".

    The underlying shape is a 5x5 grid of 10 units. The notch in the top-left corner
    is the same staircase turned 180 degrees, cut out rather than drawn, so the page
    or the tab bar shows through it. That transparency is the point of the mark and
    also its one hazard — see scripts/icons.mjs for what iOS does with it.

    Every corner is rounded, inner ones included, at TWO radii: 11 on the three tile
    corners, 3 on every step, notch included. The 3 is not a taste setting, it is
    near a hard ceiling — a step is 10 units wide, so at radius 5 the arcs from both
    ends of an edge meet, no straight run is left, and the staircase melts into a
    blob. It was tried. If the grid ever changes, re-derive this, do not carry the
    number over.
  -->
  <path
    d="M20 3A3 3 0 0 1 23 0L39 0A11 11 0 0 1 50 11L50 39A11 11 0 0 1 39 50L11 50A11 11 0 0 1 0 39L0 23A3 3 0 0 1 3 20L7 20A3 3 0 0 0 10 17L10 13A3 3 0 0 1 13 10L17 10A3 3 0 0 0 20 7Z"
    fill="#a92a4e"
  />
  <path
    d="M30 13A3 3 0 0 1 33 10L37 10A3 3 0 0 1 40 13L40 37A3 3 0 0 1 37 40L13 40A3 3 0 0 1 10 37L10 33A3 3 0 0 1 13 30L17 30A3 3 0 0 0 20 27L20 23A3 3 0 0 1 23 20L27 20A3 3 0 0 0 30 17Z"
    fill="#ffffff"
  />
</svg>
